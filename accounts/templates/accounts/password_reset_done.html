<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent - EduParadise</title>
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: #9A616D;">

    <section class="min-vh-100 d-flex align-items-center py-4">
      <div class="container">
        <div class="row d-flex justify-content-center align-items-center">
          <div class="col col-md-8 col-lg-6 col-xl-5">
            <div class="card shadow-lg border-0 text-center p-4 p-lg-5" style="border-radius: 1rem;">
              <div class="card-body">

                <!-- Logo Header -->
                <div class="d-flex justify-content-center align-items-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" class="bi bi-mortarboard-fill text-warning me-2" viewBox="0 0 16 16">
                        <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.14 3.742a.5.5 0 0 0 0 .882l7.14 3.742a.5.5 0 0 0 .422 0l7.14-3.742a.5.5 0 0 0 0-.882z"/>
                        <path d="M4.176 9.032a.5.5 0 0 0-.656.327 5.5 5.5 0 0 0-.294 2.058c.244 1.954 1.948 3.583 3.974 3.974 3.583 2.026 0 3.73-1.629 3.974-3.583a5.5 5.5 0 0 0-.294-2.058.5.5 0 0 0-.656-.327 4.5 4.5 0 0 1-.502 2.012c-.438.77-1.192 1.438-2.522 1.438s-2.084-.669-2.522-1.438a4.5 4.5 0 0 1-.502-2.012z"/>
                    </svg>
                    <span class="fs-3 fw-bold text-dark">EduParadise</span>
                </div>

                <!-- Mail Icon -->
                <div class="mb-3 text-warning">
                    <i class="fa-solid fa-paper-plane" style="font-size: 3.5rem;"></i>
                </div>

                <h3 class="fw-bold mb-3 text-dark">Check Your Email</h3>
                
                <p class="text-muted small mb-4">
                    We've emailed you instructions for setting your password. If an account exists with the email you entered, you should receive them shortly.
                </p>

                <!-- Action Button -->
                <div class="d-grid gap-2">
                    <a href="{% url 'login' %}" class="btn btn-dark btn-lg fw-semibold">Return to Login</a>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
